<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<title>List · Search expanded</title>
<link rel="stylesheet" href="../shared.css">
</head>
<body class="standalone">
<div class="phone">

  <div class="status-bar">
    <span class="time">9:41</span>
    <span class="icons"><svg class="i-18" viewBox="0 0 24 24" fill="currentColor"><path d="M2 11h3v8H2zm5-3h3v11H7zm5-3h3v14h-3zm5-3h3v17h-3z"/></svg></span>
  </div>

  <div class="search-expanded-bar">
    <span class="search-icon">
      <svg class="i-20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </span>
    <input class="search-expanded-input" placeholder="Поиск заметок" value="" autofocus />
    <button class="close-btn" aria-label="Закрыть поиск">
      <svg class="i-18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M6 18 18 6"/></svg>
    </button>
  </div>

  <div style="flex:1;overflow-y:auto;">

    <div class="search-section-label">Фильтры</div>
    <div class="search-filter-row">
      <svg class="i-20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7c0-1 .8-2 2-2h4l2 2h8c1.2 0 2 .9 2 2v9c0 1-.8 2-2 2H5c-1 0-2-.9-2-2V7z"/></svg>
      <span class="label">В папке</span>
      <span class="value">Все</span>
      <svg class="i-18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>
    </div>
    <div class="search-filter-row">
      <svg class="i-20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.6 13.4 13 21l-9-9 7.6-7.6L20.6 9z"/><circle cx="9" cy="9" r="1.5" fill="currentColor"/></svg>
      <span class="label">С тегом</span>
      <span class="value">—</span>
      <svg class="i-18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>
    </div>
    <div class="search-filter-row">
      <svg class="i-20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>
      <span class="label">За период</span>
      <span class="value">Всё время</span>
      <svg class="i-18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>
    </div>

    <div class="search-section-label">Недавнее</div>
    <div class="search-recent">
      <svg class="i-20 leading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span>встреча 10 июня</span>
      <button class="x" style="background:none;border:none;cursor:pointer;color:inherit;"><svg class="i-18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M6 18 18 6"/></svg></button>
    </div>
    <div class="search-recent">
      <svg class="i-20 leading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span>идея</span>
      <button class="x" style="background:none;border:none;cursor:pointer;color:inherit;"><svg class="i-18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M6 18 18 6"/></svg></button>
    </div>
    <div class="search-recent">
      <svg class="i-20 leading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span>#срочно</span>
      <button class="x" style="background:none;border:none;cursor:pointer;color:inherit;"><svg class="i-18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M6 18 18 6"/></svg></button>
    </div>
    <div style="padding:8px 20px 16px;">
      <button style="background:none;border:none;color:var(--primary);font:500 13px/18px var(--font-sans);cursor:pointer;padding:0;">Очистить историю</button>
    </div>

    <div class="search-section-label">Популярные теги</div>
    <div style="padding:6px 20px 24px;display:flex;flex-wrap:wrap;gap:8px;">
      <span class="chip tonal">#работа</span>
      <span class="chip tonal">#идеи</span>
      <span class="chip tonal">#срочно</span>
      <span class="chip tonal">#встречи</span>
      <span class="chip tonal">#обучение</span>
      <span class="chip tonal">#быт</span>
    </div>

  </div>

  <!-- Mock keyboard to indicate focus state -->
  <div class="keyboard">
    <div class="kb-row"><div class="kb-key">й</div><div class="kb-key">ц</div><div class="kb-key">у</div><div class="kb-key">к</div><div class="kb-key">е</div><div class="kb-key">н</div><div class="kb-key">г</div><div class="kb-key">ш</div><div class="kb-key">щ</div><div class="kb-key">з</div><div class="kb-key">х</div></div>
    <div class="kb-row"><div class="kb-key">ф</div><div class="kb-key">ы</div><div class="kb-key">в</div><div class="kb-key">а</div><div class="kb-key">п</div><div class="kb-key">р</div><div class="kb-key">о</div><div class="kb-key">л</div><div class="kb-key">д</div><div class="kb-key">ж</div><div class="kb-key">э</div></div>
    <div class="kb-row"><div class="kb-key wide">⇧</div><div class="kb-key">я</div><div class="kb-key">ч</div><div class="kb-key">с</div><div class="kb-key">м</div><div class="kb-key">и</div><div class="kb-key">т</div><div class="kb-key">ь</div><div class="kb-key">б</div><div class="kb-key">ю</div><div class="kb-key wide">⌫</div></div>
    <div class="kb-row"><div class="kb-key wide">123</div><div class="kb-key wide">🌐</div><div class="kb-key space">пробел</div><div class="kb-key wide">.</div><div class="kb-key wide">↵</div></div>
  </div>

</div>
</body>
</html>
