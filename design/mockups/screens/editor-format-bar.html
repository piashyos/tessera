<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<title>Editor · With keyboard + format bar</title>
<link rel="stylesheet" href="../shared.css">
</head>
<body class="standalone">
<div class="phone">

  <div class="status-bar">
    <span class="time">9:41</span>
    <span class="icons"><svg class="i-18" viewBox="0 0 24 24" fill="currentColor"><path d="M2 11h3v8H2zm5-3h3v11H7zm5-3h3v14h-3zm5-3h3v17h-3z"/></svg></span>
  </div>

  <div class="top-bar centered">
    <button class="icon-btn" style="color:var(--primary);"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="center-title">
      <div class="title">Работа › Проекты</div>
      <div class="subtitle">сейчас</div>
    </div>
    <div style="flex:1"></div>
    <button class="icon-btn"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3 2.6 6.5L21 10l-5 4.5L17 21l-5-3-5 3 1-6.5-5-4.5 6.4-.5z"/></svg></button>
    <button class="icon-btn"><svg class="i" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
  </div>


  <div class="inline-tags">
    <span class="tag-chip">#срочно</span>
    <span class="tag-add"><svg class="i-18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></span>
  </div>

  <div class="editor-divider"></div>

  <div class="editor-body" style="padding-bottom:340px;">
    <div class="editor-h1">Идеи для редизайна</div>
    <p class="editor-p">Material You + терракотовая айдентика, нижний поиск, FAB на той же линии.</p>
    <h2 class="editor-h2">Ключевые решения</h2>
    <ul class="editor-checklist">
      <li><span class="cb"></span><span>Папки 2 уровня вложенности</span></li>
      <li><span class="cb"></span><span>Карточки фиксированной высоты<span style="border-left:2px solid var(--primary);margin-left:2px;height:18px;display:inline-block;vertical-align:middle;animation:blink 1s infinite;"></span></span></li>
    </ul>
  </div>
  <style>@keyframes blink{50%{opacity:0;}}</style>

  <!-- Format bar (above keyboard) -->
  <div class="format-bar">
    <button class="fb-btn"><b>B</b></button>
    <button class="fb-btn"><i>I</i></button>
    <button class="fb-btn"><u>U</u></button>
    <button class="fb-btn"><s>S</s></button>
    <div class="fb-sep"></div>
    <button class="fb-btn">H1</button>
    <button class="fb-btn">H2</button>
    <button class="fb-btn">H3</button>
    <div class="fb-sep"></div>
    <button class="fb-btn"><svg class="i-20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button>
    <button class="fb-btn active"><svg class="i-20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="6" height="6" rx="1"/><path d="m4 6 1 1 2-2"/><path d="M12 6h9M3 14h6M12 14h9M3 19h6M12 19h9"/></svg></button>
    <button class="fb-btn">1.</button>
    <div class="fb-sep"></div>
    <button class="fb-btn"><svg class="i-20" viewBox="0 0 24 24" fill="currentColor"><path d="M9 7H5v6h4l-2 4h2l3-5V7zm10 0h-4v6h4l-2 4h2l3-5V7z"/></svg></button>
    <button class="fb-btn">{ }</button>
    <button class="fb-btn"><svg class="i-20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg></button>
    <div class="fb-sep"></div>
    <button class="fb-btn"><svg class="i-20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg></button>
    <button class="fb-btn"><svg class="i-20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></button>
    <button class="fb-btn"><svg class="i-20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg></button>
  </div>

  <!-- Mock keyboard -->
  <div class="keyboard">
    <div class="kb-row"><div class="kb-key">й</div><div class="kb-key">ц</div><div class="kb-key">у</div><div class="kb-key">к</div><div class="kb-key">е</div><div class="kb-key">н</div><div class="kb-key">г</div><div class="kb-key">ш</div><div class="kb-key">щ</div><div class="kb-key">з</div><div class="kb-key">х</div></div>
    <div class="kb-row"><div class="kb-key">ф</div><div class="kb-key">ы</div><div class="kb-key">в</div><div class="kb-key">а</div><div class="kb-key">п</div><div class="kb-key">р</div><div class="kb-key">о</div><div class="kb-key">л</div><div class="kb-key">д</div><div class="kb-key">ж</div><div class="kb-key">э</div></div>
    <div class="kb-row"><div class="kb-key wide">⇧</div><div class="kb-key">я</div><div class="kb-key">ч</div><div class="kb-key">с</div><div class="kb-key">м</div><div class="kb-key">и</div><div class="kb-key">т</div><div class="kb-key">ь</div><div class="kb-key">б</div><div class="kb-key">ю</div><div class="kb-key wide">⌫</div></div>
    <div class="kb-row"><div class="kb-key wide">123</div><div class="kb-key wide">🌐</div><div class="kb-key space">пробел</div><div class="kb-key wide">.</div><div class="kb-key wide">↵</div></div>
  </div>

</div>
</body>
</html>
