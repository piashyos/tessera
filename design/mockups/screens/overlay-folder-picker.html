<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<title>Overlay · Folder picker</title>
<link rel="stylesheet" href="../shared.css">
</head>
<body class="standalone">
<div class="phone">

  <div class="status-bar">
    <span class="time">9:41</span>
    <span class="icons"><svg class="i-18" viewBox="0 0 24 24" fill="currentColor"><path d="M2 11h3v8H2zm5-3h3v11H7zm5-3h3v14h-3zm5-3h3v17h-3z"/></svg></span>
  </div>

  <!-- Editor background dimmed -->
  <div style="opacity:0.4;pointer-events:none;">
    <div class="top-bar centered">
      <button class="icon-btn" style="color:var(--primary);"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="center-title">
        <div class="title">Работа › Проекты</div>
        <div class="subtitle">12 июн</div>
      </div>
      <div style="flex:1"></div>
      <button class="icon-btn"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3 2.6 6.5L21 10l-5 4.5L17 21l-5-3-5 3 1-6.5-5-4.5 6.4-.5z"/></svg></button>
      <button class="icon-btn"><svg class="i" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
    </div>
  </div>

  <!-- Sheet -->
  <div class="sheet-scrim"></div>
  <div class="sheet" style="max-height:560px;display:flex;flex-direction:column;">
    <div class="sheet-handle"></div>

    <div style="display:flex;align-items:center;padding:0 24px 16px;">
      <div style="flex:1;font:600 18px/24px var(--font-sans);color:var(--on-surface);">Переместить в…</div>
      <button style="background:none;border:none;color:var(--primary);font:500 14px/20px var(--font-sans);cursor:pointer;">Готово</button>
    </div>

    <div style="flex:1;overflow-y:auto;">
      <div class="sheet-item">
        <span class="leading"><svg class="i-20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg></span>
        Без папки
      </div>

      <div class="sheet-item">
        <span class="leading"><svg class="i-20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg></span>
        <svg class="i-20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7c0-1 .8-2 2-2h4l2 2h8c1.2 0 2 .9 2 2v9c0 1-.8 2-2 2H5c-1 0-2-.9-2-2V7z"/></svg>
        Работа
      </div>
      <div class="sheet-item" style="padding-left:64px;background:var(--secondary-container);color:var(--on-secondary-container);margin:0 12px;border-radius:28px;">
        <span class="leading" style="color:var(--primary);">
          <svg class="i-20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4" fill="currentColor"/></svg>
        </span>
        <svg class="i-20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7c0-1 .8-2 2-2h4l2 2h8c1.2 0 2 .9 2 2v9c0 1-.8 2-2 2H5c-1 0-2-.9-2-2V7z"/></svg>
        Проекты
      </div>
      <div class="sheet-item" style="padding-left:64px;">
        <span class="leading"><svg class="i-20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg></span>
        <svg class="i-20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7c0-1 .8-2 2-2h4l2 2h8c1.2 0 2 .9 2 2v9c0 1-.8 2-2 2H5c-1 0-2-.9-2-2V7z"/></svg>
        Встречи
      </div>

      <div class="sheet-item">
        <span class="leading"><svg class="i-20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg></span>
        <svg class="i-20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7c0-1 .8-2 2-2h4l2 2h8c1.2 0 2 .9 2 2v9c0 1-.8 2-2 2H5c-1 0-2-.9-2-2V7z"/></svg>
        Личное
      </div>
      <div class="sheet-item">
        <span class="leading"><svg class="i-20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg></span>
        <svg class="i-20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7c0-1 .8-2 2-2h4l2 2h8c1.2 0 2 .9 2 2v9c0 1-.8 2-2 2H5c-1 0-2-.9-2-2V7z"/></svg>
        Идеи
      </div>
    </div>

    <div style="border-top:1px solid var(--outline-variant);padding:12px 24px;display:flex;align-items:center;gap:12px;cursor:pointer;color:var(--primary);font:500 15px/22px var(--font-sans);">
      <svg class="i-20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      Новая папка
    </div>
  </div>

  <div class="home-indicator"></div>
</div>
</body>
</html>
