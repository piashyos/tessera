<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<title>List · Empty</title>
<link rel="stylesheet" href="../shared.css">
</head>
<body class="standalone">
<div class="phone">

  <div class="status-bar">
    <span class="time">9:41</span>
    <span class="icons"><svg class="i-18" viewBox="0 0 24 24" fill="currentColor"><path d="M2 11h3v8H2zm5-3h3v11H7zm5-3h3v14h-3zm5-3h3v17h-3z"/></svg></span>
  </div>

  <div class="top-bar">
    <button class="icon-btn"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    <div class="title-block">
      <div class="title">Идеи</div>
      <div class="subtitle">0 заметок</div>
    </div>
    <button class="icon-btn"><svg class="i" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
  </div>

  <div class="chip-row">
    <span class="chip selected">Все</span>
    <span class="chip tonal">+</span>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 40px;text-align:center;gap:16px;">
    <div style="width:120px;height:140px;display:grid;place-items:center;">
      <svg viewBox="0 0 120 140" width="120" height="140" fill="none">
        <rect x="14" y="18" width="92" height="108" rx="6" fill="var(--surface-container)" stroke="var(--outline-variant)" stroke-width="1.5"/>
        <rect x="14" y="18" width="92" height="22" rx="6" fill="var(--primary-container)"/>
        <path d="M26 56h68M26 70h54M26 84h60M26 98h40" stroke="var(--outline-variant)" stroke-width="2" stroke-linecap="round"/>
        <circle cx="92" cy="120" r="18" fill="var(--primary)"/>
        <path d="M92 113v14M85 120h14" stroke="var(--on-primary)" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>
    <div style="font:400 28px/34px var(--font-serif);color:var(--on-surface);">Пока пусто</div>
    <div style="font:400 14px/22px var(--font-sans);color:var(--on-surface-variant);max-width:240px;">Здесь будут ваши заметки. Нажмите на «+», чтобы создать первую.</div>
  </div>

  <div class="bottom-action">
    <div class="bottom-search">
      <svg class="i-20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span class="placeholder">Поиск заметок</span>
    </div>
    <button class="fab"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>

  <div class="home-indicator"></div>
</div>
</body>
</html>
