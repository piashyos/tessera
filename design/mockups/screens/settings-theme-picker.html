<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<title>Settings · Theme picker</title>
<link rel="stylesheet" href="../shared.css">
</head>
<body class="standalone">
<div class="phone">

  <div class="status-bar">
    <span class="time">9:41</span>
    <span class="icons"><svg class="i-18" viewBox="0 0 24 24" fill="currentColor"><path d="M2 11h3v8H2zm5-3h3v11H7zm5-3h3v14h-3zm5-3h3v17h-3z"/></svg></span>
  </div>

  <!-- Dimmed settings background -->
  <div style="opacity:0.5;pointer-events:none;">
    <div class="top-bar-large">
      <div class="row">
        <button class="icon-btn"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
      </div>
      <div class="big-title">Настройки</div>
    </div>
    <div class="settings-section">
      <div class="settings-section-label">Внешний вид</div>
      <div class="settings-group">
        <div class="settings-row">
          <div class="leading"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg></div>
          <div class="text"><div class="title-row">Тема</div></div>
          <div class="trailing">Авто</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Sheet -->
  <div class="sheet-scrim"></div>
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div style="padding:8px 24px 12px;font:600 18px/24px var(--font-sans);color:var(--on-surface);">Тема</div>

    <div style="display:flex;gap:12px;padding:8px 16px 16px;">
      <!-- Auto -->
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;">
        <div style="width:96px;height:120px;border-radius:14px;border:2px solid var(--primary);overflow:hidden;display:flex;">
          <div style="flex:1;background:linear-gradient(135deg,#FAF9F5 50%,#FFF 50%);"></div>
          <div style="flex:1;background:linear-gradient(135deg,#191815 50%,#201F1D 50%);"></div>
        </div>
        <div style="font:500 13px/18px var(--font-sans);color:var(--primary);">Авто</div>
      </div>
      <!-- Light -->
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;">
        <div style="width:96px;height:120px;border-radius:14px;border:2px solid var(--outline-variant);overflow:hidden;background:#FAF9F5;padding:8px;">
          <div style="background:#C96442;height:8px;width:30px;border-radius:4px;"></div>
          <div style="background:#EDEAE3;height:14px;margin-top:6px;border-radius:4px;"></div>
          <div style="background:#EDEAE3;height:14px;margin-top:4px;border-radius:4px;"></div>
          <div style="background:#EDEAE3;height:14px;margin-top:4px;width:60%;border-radius:4px;"></div>
        </div>
        <div style="font:400 13px/18px var(--font-sans);color:var(--on-surface);">Светлая</div>
      </div>
      <!-- Dark -->
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;">
        <div style="width:96px;height:120px;border-radius:14px;border:2px solid var(--outline-variant);overflow:hidden;background:#191815;padding:8px;">
          <div style="background:#D97757;height:8px;width:30px;border-radius:4px;"></div>
          <div style="background:#2C2B27;height:14px;margin-top:6px;border-radius:4px;"></div>
          <div style="background:#2C2B27;height:14px;margin-top:4px;border-radius:4px;"></div>
          <div style="background:#2C2B27;height:14px;margin-top:4px;width:60%;border-radius:4px;"></div>
        </div>
        <div style="font:400 13px/18px var(--font-sans);color:var(--on-surface);">Тёмная</div>
      </div>
    </div>

    <div style="padding:8px 20px 4px;font:400 13px/18px var(--font-sans);color:var(--on-surface-variant);">
      «Авто» меняет тему по системным настройкам.
    </div>
  </div>

  <div class="home-indicator"></div>
</div>
</body>
</html>
