<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<title>Overlay · Confirm dialog</title>
<link rel="stylesheet" href="../shared.css">
</head>
<body class="standalone">
<div class="phone">

  <div class="status-bar">
    <span class="time">9:41</span>
    <span class="icons"><svg class="i-18" viewBox="0 0 24 24" fill="currentColor"><path d="M2 11h3v8H2zm5-3h3v11H7zm5-3h3v14h-3zm5-3h3v17h-3z"/></svg></span>
  </div>

  <!-- Background dimmed -->
  <div style="opacity:0.4;pointer-events:none;">
    <div class="top-bar">
      <button class="icon-btn"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div class="title-block"><div class="title">Все заметки</div><div class="subtitle">124 заметки</div></div>
    </div>
    <div class="chip-row">
      <span class="chip selected">Все · 124</span>
      <span class="chip">#работа</span>
    </div>
    <div class="note-list">
      <div class="note-card"><div class="note-title">Q3 roadmap</div><div class="note-preview">Закрыть онбординг…</div><div class="note-meta"><div class="tags"><span class="tag">#работа</span></div><span class="date">12 июн</span></div></div>
    </div>
  </div>

  <!-- Dialog -->
  <div class="dialog-scrim"></div>
  <div class="dialog">
    <div class="title">Удалить заметку?</div>
    <div class="body">Заметка перейдёт в корзину и удалится навсегда через 30 дней.</div>
    <div class="actions">
      <button class="btn-text">Отмена</button>
      <button class="btn-text destructive">Удалить</button>
    </div>
  </div>

  <div class="home-indicator"></div>
</div>
</body>
</html>
